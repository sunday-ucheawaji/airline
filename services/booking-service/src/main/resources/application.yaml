server:
  port: 5008

spring:
  application:
    name: booking-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_URL}
    consumer:
      group-id: booking-service-group

booking:
  payment:
    default-gateway: STRIPE
    gateways:
      INR: RAZORPAY
      NGN: PAYSTACK
      GHS: PAYSTACK
      KES: PAYSTACK
      ZAR: PAYSTACK
