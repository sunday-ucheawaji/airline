server:
  port: 5008

spring:
  application:
    name: booking-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  jpa:
    # Off so a request holds a database connection only inside a transaction, never while waiting on another service.
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_URL}
    consumer:
      group-id: booking-service-group

booking:
  # Daily: confirmed bookings whose departure date has passed become COMPLETED
  completion-cron: "0 30 2 * * *"
  payment:
    # The accepted currencies and the gateway that takes each; any other currency is refused (no conversion).
    gateways:
      USD: STRIPE
      EUR: STRIPE
      GBP: STRIPE
      INR: RAZORPAY
      NGN: PAYSTACK
      GHS: PAYSTACK
      KES: PAYSTACK
      ZAR: PAYSTACK
