server:
  port: 8094

spring:
  application:
    name: notification-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  # ── Kafka ────────────────────────────────────────────────────────────────────
  # Consumer factory is built programmatically in KafkaConsumerConfig (generic Object type, trusted
  # packages set there) so one factory serves every event type this service consumes; these properties
  # are kept only for the group-id default and bootstrap-servers lookup.
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_URL}
    consumer:
      group-id: notification-service-group

  # ── Email (Gmail SMTP) ──────────────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  # ── Thymeleaf ───────────────────────────────────────────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${SPRING_THYMELEAF_CACHE}   # set to true in production

# ── Twilio SMS ─────────────────────────────────────────────────────────────────
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  from-number: ${TWILIO_FROM_NUMBER}
  enabled: ${TWILIO_ENABLED}

# ── Notification Settings ──────────────────────────────────────────────────────
notification:
  from-email: ${MAIL_FROM}
  from-name: ${MAIL_FROM_NAME}
  support-email: ${SUPPORT_EMAIL}
  support-phone: ${SUPPORT_PHONE}
  checkin-url: ${CHECKIN_URL}
  manage-booking-url: ${MANAGE_BOOKING_URL}
  verify-email-url: ${VERIFY_EMAIL_URL:http://localhost:3000/verify-email}
  reset-password-url: ${RESET_PASSWORD_URL:http://localhost:3000/reset-password}

# ── Resilience: each channel provider call is circuit-broken and rate-limited so a down/slow
# provider (SMTP outage, Twilio throttling) degrades to fast failures instead of hanging the
# consumer thread or hammering the vendor into a 429 storm.
resilience4j:
  circuitbreaker:
    instances:
      email:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      sms:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  ratelimiter:
    instances:
      email:
        limit-for-period: 20
        limit-refresh-period: 1s
        timeout-duration: 2s
      sms:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 2s

