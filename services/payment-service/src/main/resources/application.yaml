server:
  port: 5009

spring:
  application:
    name: payment-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_URL}

razorpay:
  api:
    key: ${RAZORPAY_API_KEY}
    secret: ${RAZORPAY_API_SECRET}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}
  callback:
    base-url: ${RAZORPAY_CALLBACK_BASE_URL}

stripe:
  api:
    secret-key: ${STRIPE_API_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}
  callback:
    base-url: ${STRIPE_CALLBACK_BASE_URL}

paystack:
  api:
    secret-key: ${PAYSTACK_API_SECRET_KEY}
  callback:
    base-url: ${PAYSTACK_CALLBACK_BASE_URL}


