server:
  port: 5010

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true

spring:
  application:
    name: subscription-service
#  config:
#    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:mysql://localhost:3306/airline_subscription
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update


info:
  app:
    name: ${spring.application.name}
    description: Manages user subscriptions and membership plans
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true